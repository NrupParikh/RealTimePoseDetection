name: Flutter Build on Merge

on:
  push:
    branches:
      - main  # Change this to your target branch

jobs:
  build-android:
    name: Android Lint, Analyze, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Dart Format Check (Dry Run)
        run: dart format .

      - name: Run Android Lint
        run: |
          cd android 
          ./gradlew app:lintDebug

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html

      - name: Run ktlint Check (Kotlin Format Check)
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.2.1/ktlint && chmod +x ktlint
          ./ktlint "android/**/*.kt" --reporter=plain

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk