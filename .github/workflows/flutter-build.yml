name: Flutter Build on Merge

on:
  push:
    branches:
      - main  # Change this to your target branch

jobs:
  build-android:
    name: Android Lint, Analyze, Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Dart Format Check (Dry Run)
        run: dart format .

      - name: Run Android Lint
        run: |
          cd android 
          chmod +x gradlew
          ./gradlew app:lintDebug

      - name: Upload Android Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: build/app/reports/lint-results-debug.html

      - name: Run ktlint Check (Kotlin Format Check)
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.2.1/ktlint && chmod +x ktlint
          ./ktlint "android/**/*.kt" --reporter=plain || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release (skip if quota full)
        run: |
          set +e
          # Ensure release exists
          gh release create temp-release --notes "Temporary release for APK artifacts" || true
          # Try uploading
          gh release upload temp-release build/app/outputs/flutter-apk/app-release.apk --clobber 2>/tmp/error.log
          if grep -q "Artifact storage quota has been hit" /tmp/error.log; then
            echo "⚠️ Artifact storage quota reached, skipping upload to Release."
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
